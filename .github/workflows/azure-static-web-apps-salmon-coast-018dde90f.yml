name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

# Least privilege: the deploy needs to read the tree, and the SWA action needs
# to write the PR preview comment. Nothing here should write to the repo.
permissions:
  contents: read
  pull-requests: write

# WHY: two quick pushes to main otherwise race two deployments and whichever
# finishes last wins, which is not necessarily the newer commit.
concurrency:
  group: swa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        # WHY these live here and not in the Azure Portal: Astro inlines
        # import.meta.env at BUILD time, and the build runs in this job. Portal
        # application settings are injected at request time into a running API,
        # which this static site does not have — they would never reach the
        # bundle. Setting them in the Portal produces a form that posts to the
        # fallback endpoint and silently drops every lead.
        env:
          # LOAD-BEARING LITERAL — do not move this into GitHub Secrets.
          # ContactForm.astro's build guard only fires when this value contains
          # "web3forms.com". If it becomes an empty secret the guard silently
          # disarms, the build goes green, and the site ships a form posting to
          # the /api/contact fallback that drops every lead. Verified: with both
          # vars unset the build exits 0 and bakes action="/api/contact".
          PUBLIC_FORM_ENDPOINT: https://api.web3forms.com/submit
          # Public by design (it is rendered into the HTML) but kept in GitHub
          # Secrets so it can be rotated without a commit.
          PUBLIC_FORM_ACCESS_KEY: ${{ secrets.PUBLIC_FORM_ACCESS_KEY }}
          # WHY a literal, not a GitHub Secret: the GA4 measurement ID is not
          # sensitive — it is visible in the page source of every site that
          # uses it. Treating it as a secret would only make it harder to see
          # which property a build reports to.
          PUBLIC_GA_MEASUREMENT_ID: G-MHQNGNC9YY
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_COAST_018DDE90F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "viis-site" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_COAST_018DDE90F }}
          action: "close"
