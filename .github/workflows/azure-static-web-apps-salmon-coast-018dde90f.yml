name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

# Least privilege: the deploy needs to read the tree, and the SWA action needs
# to write the PR preview comment. Nothing here should write to the repo.
permissions:
  contents: read
  pull-requests: write

# WHY: two quick pushes to main otherwise race two deployments and whichever
# finishes last wins, which is not necessarily the newer commit.
concurrency:
  group: swa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        # WHY these live here and not in the Azure Portal: Astro inlines
        # import.meta.env at BUILD time, and the build runs in this job. Portal
        # application settings are injected at request time into the running
        # API; they never reach the static bundle.
        env:
          # WHY a literal, not a GitHub Secret: the GA4 measurement ID is not
          # sensitive — it is visible in the page source of every site that
          # uses it. Treating it as a secret would only make it harder to see
          # which property a build reports to.
          PUBLIC_GA_MEASUREMENT_ID: G-MHQNGNC9YY
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_COAST_018DDE90F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "viis-site" # App source code path
          # The audit form posts to /api/audit, a managed Function in this
          # directory. Oryx runs its npm install and `npm run build` (tsc);
          # the runtime is platform.apiRuntime in staticwebapp.config.json.
          # Empty, the form's endpoint does not exist and every request 404s.
          api_location: "viis-site/api"
          output_location: "dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_COAST_018DDE90F }}
          action: "close"
