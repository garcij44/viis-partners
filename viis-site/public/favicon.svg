<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 128 128">
    <!-- Montserrat "V" outlined from public/fonts/montserrat-variable.woff2 at
         wght 600, cap top y 8 and baseline y 120 so both land on the 16/32/48
         pixel grid, centred. WHY 600, not the headings' 500: rendered at 16px,
         500's 1.3px strokes turn half the V into grey antialiasing; 600 gives
         37% more solid pixels while the counter stays open to row 9 of 16.
         700 fills the counter from row 8 and reads as a wedge. -->
    <path d="M53.8 120 4.91 8H27.44L71.15 109.25H58.14L102.41 8H123.09L74.34 120Z" />
    <style>
        /* Palette tokens, not #000/#FFF — "pure white text or pure black
           anything" is a verbatim anti-pattern, and this mark is on screen in
           every tab. Literals rather than var() because an SVG loaded as a
           favicon has no access to the document's custom properties. */
        path { fill: #121319; }
        @media (prefers-color-scheme: dark) {
            path { fill: #ECE7DB; }
        }
    </style>
</svg>
